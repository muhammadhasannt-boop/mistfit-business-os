
name: Build MISTFIT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Ensure Android Internet permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml

          if ! grep -q 'android.permission.INTERNET' "$FILE"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$FILE"
          fi

          grep 'android.permission.INTERNET' "$FILE"

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [[ ! "$SUPABASE_URL" =~ ^https://[a-zA-Z0-9-]+\.supabase\.co$ ]]; then
            echo "ERROR: Supabase URL format incorrect."
            exit 1
          fi

          if [[ -z "$SUPABASE_ANON_KEY" ]]; then
            echo "ERROR: Supabase publishable key is missing."
            exit 1
          fi

          echo "Supabase URL format: OK"
          echo "Supabase key presence: OK"
          echo "Secret values are hidden."

      - name: Check Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          curl --silent --show-error \
            --output /dev/null \
            --write-out "Supabase HTTP status: %{http_code}\n" \
            --connect-timeout 15 \
            "$SUPABASE_URL" || {
              echo "ERROR: Supabase host connection failed."
              exit 1
            }

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MISTFIT-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
